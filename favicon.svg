<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="opGradFavicon" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="opGlowFavicon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background rounded tile -->
  <rect width="100" height="100" rx="24" fill="#0B0F19"/>
  <rect width="100" height="100" rx="24" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Intertwined O & P Constellation Loop -->
  <path d="M42 24 C25 24 16 36 16 52 C16 68 25 80 42 80 C53 80 61 73 65 62 L65 52" 
        stroke="url(#opGradFavicon)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#opGlowFavicon)"/>

  <path d="M48 80 L48 24 C48 24 58 22 68 24 C79 26 85 34 85 45 C85 56 77 62 65 62 L48 62" 
        stroke="url(#opGradFavicon)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#opGlowFavicon)"/>

  <!-- Orion's Belt: 3 Celestial Beacon Stars -->
  <circle cx="57" cy="37" r="3" fill="#FFFFFF"/>
  <circle cx="65" cy="45" r="3.5" fill="#4EDEA3"/>
  <circle cx="73" cy="53" r="3" fill="#FFFFFF"/>
</svg>
